[project]
name = "bistreroc"
version = "0.1.0"
description = "Sparse-aware signature generation and cell-fraction estimation"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]
keywords = ["bioinformatics", "deconvolution", "single-cell", "transcriptomics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.urls]
Homepage = "https://github.com/whatever60/BistreRoc"
Issues = "https://github.com/whatever60/BistreRoc/issues"
Repository = "https://github.com/whatever60/BistreRoc"

[project.scripts]
bistreroc = "bistreroc.cli:main"

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bistreroc = [
  "r/*.R",
]

[dependency-groups]
dev = [
  "pytest>=8.4",
  "ruff>=0.12",
]

[tool.pytest.ini_options]
testpaths = ["tests", "benchmarks/tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "N"]
